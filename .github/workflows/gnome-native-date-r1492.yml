name: GNOME Calculator native date feature R1492
on:
  push:
    branches: [codex/calculator-date-proof-r1492]
permissions:
  contents: read
jobs:
  baseline:
    if: github.repository == 'pythonyx135793/gnome-calculator' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact implemented application plus proof
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Review distro candidates and install ordinary native build tools
        run: |
          mkdir -p "$RUNNER_TEMP/gnome-r1492/evidence"
          sudo apt-get update > "$RUNNER_TEMP/gnome-r1492/evidence/apt-update.log" 2>&1
          packages=(meson ninja-build valac gcc gettext itstool yelp-tools libgtk-3-dev libgtk-3-bin libgtksourceview-4-dev libmpc-dev libmpfr-dev libsoup2.4-dev libxml2-dev libgee-0.8-dev libhandy-1-dev gobject-introspection libgirepository1.0-dev xvfb xauth dbus-x11 python3-gi gir1.2-gtk-3.0 gir1.2-atspi-2.0 at-spi2-core)
          apt-cache policy "${packages[@]}" > "$RUNNER_TEMP/gnome-r1492/evidence/apt-candidates.log"
          sudo apt-get install -y --no-install-recommends "${packages[@]}" > "$RUNNER_TEMP/gnome-r1492/evidence/apt-install.log" 2>&1
          dpkg-query -W > "$RUNNER_TEMP/gnome-r1492/evidence/dpkg-versions.txt"
      - name: Compile, stock tests and actual native date flows in isolated environment
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B proof/calculator-date-r1492/run.py
      - name: Preserve exact evidence in ordinary job logs
        if: always()
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B proof/calculator-date-r1492/export.py
